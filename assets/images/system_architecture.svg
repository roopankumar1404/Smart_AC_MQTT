<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c084fc" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 11px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 10px; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 12px; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 10.5px; }
    .line-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 9.5px; fill: #cbd5e1; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="590" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- ==================== LAYER 1: CLIENT & CLOUD (TOP) ==================== -->

  <!-- Flutter App Card -->
  <g filter="url(#shadow)">
    <rect x="40" y="35" width="250" height="85" rx="12" fill="url(#cardGradBlue)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="52" y="47" width="26" height="26" rx="6" fill="#0284c7" />
    <text x="65" y="65" text-anchor="middle" font-size="15">📱</text>
    <text x="88" y="58" class="title" font-size="14">Flutter Mobile App</text>
    <text x="88" y="73" class="subtitle">Android &amp; iOS Reactive Dashboard</text>
    <text x="52" y="104" class="item-desc">Controls AC, Live Telemetry &amp; Energy Graphs</text>
  </g>

  <!-- EMQX Cloud Broker Card -->
  <g filter="url(#shadow)">
    <rect x="355" y="35" width="250" height="85" rx="12" fill="url(#cardGradGreen)" stroke="#34d399" stroke-width="1.5" />
    <rect x="367" y="47" width="26" height="26" rx="6" fill="#059669" />
    <text x="380" y="65" text-anchor="middle" font-size="15">☁️</text>
    <text x="403" y="58" class="title" font-size="14">EMQX Cloud Broker</text>
    <text x="403" y="73" class="subtitle">Managed MQTTS TLS (Port 8883)</text>
    <text x="367" y="104" class="item-desc">High-Throughput Pub/Sub + Cloud Rule Engine</text>
  </g>

  <!-- Telegram Bot API Card -->
  <g filter="url(#shadow)">
    <rect x="670" y="35" width="250" height="85" rx="12" fill="url(#cardGradBlue)" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="682" y="47" width="26" height="26" rx="6" fill="#0284c7" />
    <text x="695" y="65" text-anchor="middle" font-size="15">🔔</text>
    <text x="718" y="58" class="title" font-size="14">Telegram Bot API</text>
    <text x="718" y="73" class="subtitle">24/7 Automated Notification Bot</text>
    <text x="682" y="104" class="item-desc">Instant Brownout, Power &amp; Session Digests</text>
  </g>

  <!-- Top Connectors -->
  <!-- Flutter <-> EMQX -->
  <path d="M 290 77 L 355 77" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 355 83 L 290 83" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <rect x="298" y="68" width="50" height="15" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="323" y="79" text-anchor="middle" class="line-label">MQTTS</text>

  <!-- EMQX -> Telegram -->
  <path d="M 605 77 L 670 77" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)" />
  <rect x="612" y="68" width="50" height="15" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="637" y="79" text-anchor="middle" class="line-label">Webhook</text>


  <!-- ==================== LAYER 2: ESP32 DUAL-CORE ENGINE (MIDDLE) ==================== -->

  <!-- ESP32 Outer Container -->
  <g filter="url(#shadow)">
    <rect x="40" y="155" width="880" height="260" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8" />

    <!-- Container Header Badge -->
    <rect x="55" y="145" width="310" height="22" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" />
    <text x="210" y="160" text-anchor="middle" class="badge-text" fill="#eff6ff">⚡ ESP32 DUAL-CORE FREERTOS ARCHITECTURE</text>
  </g>

  <!-- Core 0 Sub-Card -->
  <g filter="url(#shadow)">
    <rect x="60" y="180" width="385" height="215" rx="10" fill="url(#cardGradPurple)" stroke="#a855f7" stroke-width="1.2" />
    <text x="75" y="202" class="title" font-size="13" fill="#e9d5ff">CORE 0 : Networking &amp; Protocols Stack</text>
    <text x="75" y="215" class="subtitle">Priority 1 FreeRTOS Task (Continuous Loop)</text>

    <!-- Item 1 -->
    <rect x="75" y="225" width="355" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8" />
    <text x="85" y="240" class="item-title">MQTTS TLS Client (Port 8883)</text>
    <text x="85" y="252" class="item-desc">Encrypted telemetry publish &amp; incoming command handling</text>

    <!-- Item 2 -->
    <rect x="75" y="265" width="355" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8" />
    <text x="85" y="280" class="item-title">WiFi 802.11 b/g/n &amp; Self-Healing Watchdogs</text>
    <text x="85" y="292" class="item-desc">Non-blocking background reconnect routines &amp; NTP clock sync</text>

    <!-- Item 3 -->
    <rect x="75" y="305" width="355" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8" />
    <text x="85" y="320" class="item-title">FreeRTOS Asynchronous Telegram Dispatcher</text>
    <text x="85" y="332" class="item-desc">Thread-safe FIFO message queue for cloud alert emission</text>

    <!-- Item 4 -->
    <rect x="75" y="345" width="355" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8" />
    <text x="85" y="360" class="item-title">NVS Flash Memory &amp; State Persistence</text>
    <text x="85" y="372" class="item-desc">Restores power state, timers &amp; filter runtime upon reboot</text>
  </g>

  <!-- Core 1 Sub-Card -->
  <g filter="url(#shadow)">
    <rect x="515" y="180" width="385" height="215" rx="10" fill="url(#cardGradAmber)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="530" y="202" class="title" font-size="13" fill="#fef3c7">CORE 1 : Sensors &amp; AC Hardware Loop</text>
    <text x="530" y="215" class="subtitle">Sub-millisecond Precision Timing (loop())</text>

    <!-- Item 1 -->
    <rect x="530" y="225" width="355" height="34" rx="6" fill="#451a03" stroke="#b45309" stroke-width="0.8" />
    <text x="540" y="240" class="item-title">PZEM-004T v3.0 Power Meter (UART2 GPIO 16/17)</text>
    <text x="540" y="252" class="item-desc">Samples V, A, W, kWh, Frequency &amp; PF every 2.5s</text>

    <!-- Item 2 -->
    <rect x="530" y="265" width="355" height="34" rx="6" fill="#451a03" stroke="#b45309" stroke-width="0.8" />
    <text x="540" y="280" class="item-title">IR Receiver (GPIO 4) &amp; Blaster (GPIO 5)</text>
    <text x="540" y="292" class="item-desc">38kHz IR remote loopback sync &amp; LG AC protocol modulation</text>

    <!-- Item 3 -->
    <rect x="530" y="305" width="355" height="34" rx="6" fill="#451a03" stroke="#b45309" stroke-width="0.8" />
    <text x="540" y="320" class="item-title">DHT22 Power Gating (GPIO 15 / Gating GPIO 25)</text>
    <text x="540" y="332" class="item-desc">Transistor-isolated power cycling stops sensor self-heating</text>

    <!-- Item 4 -->
    <rect x="530" y="345" width="355" height="34" rx="6" fill="#451a03" stroke="#b45309" stroke-width="0.8" />
    <text x="540" y="360" class="item-title">SSD1306 0.96" OLED (I2C) &amp; Tactile Button (GPIO 2)</text>
    <text x="540" y="372" class="item-desc">Multi-screen diagnostics dashboard with hardware debouncing</text>
  </g>

  <!-- Core Inter-communication Queue Badge -->
  <g>
    <rect x="450" y="260" width="60" height="55" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="480" y="278" text-anchor="middle" font-size="12">🔄</text>
    <text x="480" y="293" text-anchor="middle" class="badge-text" fill="#c7d2fe">FreeRTOS</text>
    <text x="480" y="305" text-anchor="middle" class="badge-text" fill="#c7d2fe">Queue</text>
  </g>

  <!-- Core 0 <-> EMQX Connector -->
  <path d="M 440 120 L 440 155" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 430 155 L 430 120" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="395" y="125" width="75" height="16" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="432" y="137" text-anchor="middle" class="line-label">TLS MQTTS</text>


  <!-- ==================== LAYER 3: PHYSICAL HARDWARE (BOTTOM) ==================== -->

  <!-- Physical Remote Card -->
  <g filter="url(#shadow)">
    <rect x="60" y="475" width="240" height="75" rx="10" fill="url(#cardGradDark)" stroke="#64748b" stroke-width="1.2" />
    <text x="75" y="498" class="title" font-size="13">📡 Physical IR Remote</text>
    <text x="75" y="513" class="subtitle">OEM Handheld Controller</text>
    <text x="75" y="534" class="item-desc">38kHz IR modulation signals</text>
  </g>

  <!-- AC Unit Card -->
  <g filter="url(#shadow)">
    <rect x="360" y="475" width="240" height="75" rx="10" fill="url(#cardGradDark)" stroke="#06b6d4" stroke-width="1.2" />
    <text x="375" y="498" class="title" font-size="13">❄️ Split Air Conditioner</text>
    <text x="375" y="513" class="subtitle">Indoor Unit (LG Dual-Inverter)</text>
    <text x="375" y="534" class="item-desc">Target compressor &amp; blower</text>
  </g>

  <!-- Mains Power Card -->
  <g filter="url(#shadow)">
    <rect x="660" y="475" width="240" height="75" rx="10" fill="url(#cardGradDark)" stroke="#f43f5e" stroke-width="1.2" />
    <text x="675" y="498" class="title" font-size="13">⚡ 230V AC Mains Power</text>
    <text x="675" y="513" class="subtitle">Single Phase 50Hz Utility Line</text>
    <text x="675" y="534" class="item-desc">Current CT clamp &amp; voltage bus</text>
  </g>

  <!-- Bottom Connectors -->
  <!-- Remote -> Core 1 IR_RX -->
  <path d="M 180 475 L 180 440 L 590 440 L 590 395" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrowAmber)" />
  <rect x="340" y="432" width="105" height="16" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="392" y="444" text-anchor="middle" class="line-label">IR Receive (GPIO 4)</text>

  <!-- Core 1 IR_TX -> AC Unit -->
  <path d="M 680 395 L 680 440 L 480 440 L 480 475" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowBlue)" />
  <rect x="525" y="432" width="95" height="16" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="572" y="444" text-anchor="middle" class="line-label">IR Blast (GPIO 5)</text>

  <!-- Mains -> PZEM -->
  <path d="M 780 475 L 780 395" fill="none" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#arrowAmber)" />
  <rect x="740" y="432" width="80" height="16" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="780" y="444" text-anchor="middle" class="line-label">CT Sense (100A)</text>

</svg>
