name: smart_ac_mqtt
description: "Smart AC Controller - MQTT Edition"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Auth + Firestore for energy logs only)
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.1
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.0.0

  # MQTT
  mqtt_client: ^10.6.1

  # State management
  provider: ^6.1.2

  # UI
  google_fonts: ^8.2.1
  gap: ^3.0.1
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  lottie: ^3.5.1
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  timezone: ^0.9.4
  flutter_local_notifications: ^18.0.1
  googleapis_auth: ^2.3.3
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
